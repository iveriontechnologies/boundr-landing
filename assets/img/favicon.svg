<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Boundr">
  <!-- The header logo at 32px: a violet tile, two bracket halves framing an
       area, and the dot sitting just outside the corner. Flat shapes only —
       a favicon is rendered at 16px and anything finer disappears. -->
