  <path d="M14 9H10v14h4" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 9h2v14h-2" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="26" cy="6" r="4" fill="#EE7723"/>
</svg>
